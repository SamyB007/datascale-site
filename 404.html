<!doctype html>

<head>

<style>
@font-face{font-family:"Schibsted Grotesk";src:url("/assets/fonts/SchibstedGrotesk-Variable.woff2") format("woff2");font-weight:400 900;font-style:normal;font-display:swap}
@font-face{font-family:"Martian Mono";src:url("/assets/fonts/MartianMono-Variable.woff2") format("woff2");font-weight:100 800;font-style:normal;font-display:swap}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img,svg,canvas{display:block;max-width:100%}
p,h1,h2,h3,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #C62828;outline-offset:3px}
.pistes{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:999;display:flex;gap:2px;padding:4px;background:#1D1A18;border-radius:999px;font:500 12px/1 "Martian Mono",Menlo,monospace;box-shadow:0 8px 28px rgba(29,26,24,.28);max-width:calc(100vw - 24px)}
.pistes a{color:#C9C1B9;text-decoration:none;padding:9px 13px;border-radius:999px;white-space:nowrap}
.pistes a:hover{color:#FFFFFF}
.pistes a[aria-current="page"]{background:#FC3030;color:#FFFFFF}
@media (max-width:640px){.pistes{font-size:11px}.pistes a{padding:8px 9px}.pistes .long{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

h1{font-size:clamp(44px,7vw,112px);line-height:.92;font-weight:800;letter-spacing:-.05em;max-width:12ch}
p{font-size:19px;line-height:1.5;color:var(--graphite)}
.btn{display:inline-flex;align-items:center;height:50px;padding:0 26px;border-radius:2px;background:var(--carmin);color:#FFFFFF;font-weight:600;text-decoration:none;justify-self:start}
.btn:hover{background:var(--carmin-profond)}
